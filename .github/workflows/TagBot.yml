name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
# Explicit, because the repository default for `GITHUB_TOKEN` is read-only
permissions:
  contents: write  # to push tags and create releases
  issues: write  # to open an issue when a release cannot be created
  pull-requests: read  # for the changelog
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
